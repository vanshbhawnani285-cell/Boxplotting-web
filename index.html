<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        .box{
            margin: auto;
            /* margin-top: 100px; */
            height: 500px;
            width: 800px;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .box1{
            height: 80%;
            width: 80%;
            background-color: blue;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color:orange;
            border: 30px solid burlywood;
            margin: 40px 0px 40px 60px;
            padding: 50px 0px 0px 80px ;
        }
         .box3{
            height: 70%;
            width: 75%;
            color: white;
            text-align: center;
            line-height: 180px;
            background-color:blue;
            margin: auto;
            margin-right: 90px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .margin,.border,.padding{ 
            position: absolute;
            left: 48%;
            color: white;
        }
        .margin{
            top: 100px;
        }
        .border{
            top: 130px;
        }
        .padding{
            top: 160px;
        }
        
</style>
</head>
<body>
    <h1 align="center">
        Box Modeling
    </h1>
    <div class="box">
        <div class="box1">
            <div class="margin">Margin</div>
            <div class="box2">
                <div class="border">Border</div>
                <div class="padding">Padding</div>
                <div class="box3">Content</div>
            </div>
        </div>
    </div>
</body>
</html>
